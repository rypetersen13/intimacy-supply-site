[functions]
  directory = "netlify/functions"

# Built assets are content-hashed, so they can be cached for a year.
[[headers]]
  for = "/assets/app.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Private pages must not show up in search.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/creator.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/order-confirmation.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Stock sync from the distributor feed (dry run until SYNC_LIVE=1 is set in Netlify).
[functions."sync-stock"]
  schedule = "0 5,14 * * *"

# Review requests two weeks after payment (dry run until REVIEW_EMAILS_LIVE=1 is set in Netlify).
[functions."send-review-requests"]
  schedule = "0 16 * * *"

# Automatic Eldorado fulfillment (dry run until ELDORADO_ORDERS_LIVE=1 is set in Netlify).
# send-orders-to-eldorado: pushes newly-paid orders to Eldorado's /uploads folder over SFTP.
# import-eldorado-tracking: reads /shipping_confirmation, marks orders shipped, emails tracking.
[functions."send-orders-to-eldorado"]
  schedule = "*/15 * * * *"
[functions."import-eldorado-tracking"]
  schedule = "0,30 * * * *"
